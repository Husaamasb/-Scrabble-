name: Build Scrabble for iOS Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Generate native iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Apply original Scrabble logo to iOS app icon
        run: |
          python -m pip install Pillow
          python scripts/generate-native-icons.py

      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \\
            -project ios/App/App.xcodeproj \\
            -scheme App \\
            -sdk iphonesimulator \\
            -configuration Debug \\
            -destination 'generic/platform=iOS Simulator' \\
            -derivedDataPath build/ios \\
            CODE_SIGNING_ALLOWED=NO \\
            build

      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          /usr/bin/zip -r "$GITHUB_WORKSPACE/Scrabble-iOS-Simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: Scrabble-iOS-Simulator
          path: Scrabble-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
