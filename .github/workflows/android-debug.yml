name: Build Scrabble for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply original Scrabble logo to Android launcher icons
        run: |
          python -m pip install Pillow
          python scripts/generate-native-icons.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Scrabble-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
