name: Build Scrabble for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply original Scrabble logo to Android launcher icons
        run: |
          python -m pip install Pillow
          python scripts/generate-native-icons.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Scrabble-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.husaamasb.scrabble 1
            sleep 45
            adb shell pidof com.husaamasb.scrabble >/dev/null || { echo "Scrabble process is not running after launch"; adb logcat -d -t 1000; exit 1; }
            adb logcat -d -v time > "$GITHUB_WORKSPACE/android-logcat.txt"
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/android-activity.txt"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/android-window.xml" >/dev/null 2>&1 || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/scrabble-emulator.png"
            test -s "$GITHUB_WORKSPACE/scrabble-emulator.png"
            grep -q "mResumedActivity" "$GITHUB_WORKSPACE/android-activity.txt" || { echo "No resumed Android activity"; cat "$GITHUB_WORKSPACE/android-activity.txt"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Scrabble-Android-Emulator-Screenshot
          path: scrabble-emulator.png
          if-no-files-found: error
          retention-days: 14
