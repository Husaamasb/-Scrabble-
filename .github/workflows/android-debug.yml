name: Build Scrabble for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web app for Capacitor
        run: CAPACITOR_BUILD=true npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply original Scrabble logo to Android launcher icons
        run: |
          python -m pip install Pillow
          python scripts/generate-native-icons.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Scrabble-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.husaamasb.scrabble 1
            sleep 12
            if ! adb shell pidof com.husaamasb.scrabble; then
              echo "Scrabble process is not running after launch"
              adb logcat -d -t 500
              exit 1
            fi
            adb shell dumpsys activity activities > /tmp/scrabble-activities.txt
            if ! grep -q 'com.husaamasb.scrabble' /tmp/scrabble-activities.txt; then
              echo "Scrabble activity was not found in the activity manager output"
              cat /tmp/scrabble-activities.txt
              adb logcat -d -t 500
              exit 1
            fi
            adb shell screencap -p /sdcard/scrabble-emulator.png
            adb pull /sdcard/scrabble-emulator.png "$GITHUB_WORKSPACE/scrabble-emulator.png"

      - uses: actions/upload-artifact@v4
        with:
          name: Scrabble-Android-Emulator-Screenshot
          path: scrabble-emulator.png
          if-no-files-found: error
          retention-days: 14
